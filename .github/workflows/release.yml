name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install
      - run: pnpm build
      - run: pnpm test
      - name: Publish packages
        run: |
          VERSION="$(node -p "require('./packages/cli/package.json').version")"
          if npm view "@appeeky/google-play-store-cli@${VERSION}" version >/dev/null 2>&1; then
            echo "npm already has @appeeky/google-play-store-cli@${VERSION} — skipping publish"
          else
            pnpm --filter @appeeky/google-play-store-cli publish --access public --no-git-checks
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
